project_id = "campusloop"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[storage]
enabled = true

[functions.admin-review]
verify_jwt = true

[functions.verify-student-id]
verify_jwt = false

[functions.redeem-deal]
verify_jwt = true

[functions.validate-coupon]
verify_jwt = true

[functions.submit-verification]
verify_jwt = true

[functions.manage-request]
verify_jwt = true
